[project]
name = "super-resolution-studio"
version = "0.1.0"
description = "Multi-model image super-resolution UI/CLI with isolated provider runtimes"
readme = "README.md"
requires-python = ">=3.11,<3.15"
license = { text = "Apache-2.0" }
authors = [{ name = "arumajirou" }]
dependencies = [
  "gradio>=6.20.0,<7",
  "pillow>=12.3.0,<13",
  "pydantic>=2.13.4,<3",
  "typer>=0.27.0,<1",
]

[project.scripts]
sr-studio = "sr_studio.cli:app"

[dependency-groups]
dev = [
  "mypy>=2.3.0,<3",
  "pytest>=9.1.1,<10",
  "pytest-cov>=7.1.0,<8",
  "ruff>=0.15.22,<1",
]

[build-system]
requires = ["hatchling>=1.31.0,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sr_studio"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_configs = true
packages = ["sr_studio"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
